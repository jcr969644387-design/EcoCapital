name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    name: Generar APK único (release)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f1)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk "EcoCapital-v${{ steps.version.outputs.name }}.apk"
          ls -lh "EcoCapital-v${{ steps.version.outputs.name }}.apk"

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: EcoCapital-v${{ steps.version.outputs.name }}-apk
          path: EcoCapital-v${{ steps.version.outputs.name }}.apk
          if-no-files-found: error

      - name: Publish APK (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: EcoCapital v${{ steps.version.outputs.name }}
          files: EcoCapital-v${{ steps.version.outputs.name }}.apk
          make_latest: true
